<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شجرة العائلة - التصميم العمودي النحيف</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #fff; margin: 0; overflow: hidden; }
        #toolbar { 
            position: fixed; top: 20px; right: 20px; z-index: 1000; 
            background: rgba(255,255,255,0.9); padding: 12px; border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; gap: 10px;
        }
        button { 
            padding: 8px 16px; cursor: pointer; border-radius: 4px; border: none; 
            background: #2c3e50; color: white; font-weight: bold;
        }
        .pdf-btn { background: #e74c3c; }
        #tree-container { width: 100vw; height: 100vh; background: white; }
        .node rect { fill: #fff; stroke: #2980b9; stroke-width: 2px; rx: 5; }
        .node text { font-size: 13px; font-weight: bold; text-anchor: middle; fill: #333; }
        .link { fill: none; stroke: #bdc3c7; stroke-width: 1.5px; }
    </style>
</head>
<body>

<div id="toolbar">
    <button class="pdf-btn" onclick="exportFullPDF()">📥 تصدير PDF (الشكل العمودي)</button>
    <button onclick="resetZoom()">🔄 ضبط الشاشة</button>
</div>

<div id="tree-container"></div>

<script>
    const csvURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT_6K2hzmPfC9PGa-p0rbJvVsGxP7B7fb2yqXJC8CS34Q9gYAkN_M2HHvadooj2csNe5gZ5kDFIw2hh/pub?output=csv';
    let svg, g, zoom, treeRoot;

    Papa.parse(csvURL, {
        download: true, header: false, skipEmptyLines: true,
        complete: function(results) {
            const relations = new Map();
            const names = new Set();
            results.data.forEach(row => {
                for (let i = 0; i < row.length - 1; i++) {
                    let child = row[i]?.trim(), parent = row[i+1]?.trim();
                    if (child && parent && child !== parent) {
                        names.add(child); names.add(parent);
                        relations.set(child, parent);
                    }
                }
            });

            const data = [{ name: "ROOT", parent: "" }];
            names.forEach(n => {
                let p = relations.get(n);
                if (!p || !names.has(p)) p = "ROOT";
                data.push({ name: n, parent: p });
            });
            drawSlimTree(data);
        }
    });

    function drawSlimTree(data) {
        const width = window.innerWidth, height = window.innerHeight;
        svg = d3.select("#tree-container").append("svg").attr("width", width).attr("height", height);
        g = svg.append("g");
        
        zoom = d3.zoom().on("zoom", (e) => g.attr("transform", e.transform));
        svg.call(zoom);

        treeRoot = d3.stratify().id(d => d.name).parentId(d => d.parent)(data);
        
        // السر هنا: تقليل العرض (80) وزيادة الطول (300) لتحويل العريض إلى نحيف وطويل
        d3.tree().nodeSize([80, 300])(treeRoot);

        g.selectAll(".link").data(treeRoot.links()).enter().append("path").attr("class", "link")
            .attr("d", d3.linkVertical().x(d => d.x).y(d => d.y))
            .style("opacity", d => d.source.id === "ROOT" ? 0 : 1);

        const node = g.selectAll(".node").data(treeRoot.descendants()).enter().append("g")
            .attr("class", "node").attr("transform", d => `translate(${d.x},${d.y})`)
            .style("opacity", d => d.id === "ROOT" ? 0 : 1);

        node.append("rect").attr("x", -60).attr("y", -15).attr("width", 120).attr("height", 30);
        node.append("text").attr("dy", 5).text(d => d.id);
        
        resetZoom();
    }

    function resetZoom() {
        svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(window.innerWidth/2, 40).scale(0.4));
    }

    async function exportFullPDF() {
        const bounds = g.node().getBBox();
        const canvas = await html2canvas(document.body, { scale: 2, useCORS: true });
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
            orientation: 'p', // وضع عمودي (Portrait)
            unit: 'px',
            format: [canvas.width, canvas.height]
        });
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, canvas.width, canvas.height);
        pdf.save('Vertical_Family_Tree.pdf');
    }
</script>
</body>
</html>
