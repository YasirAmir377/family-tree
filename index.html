<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شجرة العائلة الاحترافية</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma; background: #f8f9fa; margin: 0; overflow: hidden; }
        #controls { position: absolute; top: 20px; right: 20px; z-index: 100; display: flex; gap: 10px; }
        button { padding: 10px 15px; cursor: pointer; border-radius: 5px; border: none; background: #2c3e50; color: white; font-weight: bold; }
        button:hover { background: #34495e; }
        .node rect { fill: #fff; stroke: #2c3e50; stroke-width: 2px; rx: 5; ry: 5; }
        .node text { font-size: 14px; font-weight: bold; fill: #2c3e50; text-anchor: middle; }
        .link { fill: none; stroke: #bdc3c7; stroke-width: 2px; }
        #tree-container { width: 100vw; height: 100vh; cursor: grab; }
    </style>
</head>
<body>

    <div id="controls">
        <button onclick="exportPDF()">تصدير PDF</button>
        <button onclick="resetZoom()">إعادة الضبط</button>
    </div>
    
    <div id="tree-container"></div>

    <script>
        const csvURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT_6K2hzmPfC9PGa-p0rbJvVsGxP7B7fb2yqXJC8CS34Q9gYAkN_M2HHvadooj2csNe5gZ5kDFIw2hh/pub?output=csv';

        let svg, g, zoom;

        Papa.parse(csvURL, {
            download: true, header: false, skipEmptyLines: true,
            complete: function(results) {
                const rawData = results.data.slice(1);
                // منع التكرار: نأخذ أول ظهور لكل اسم فقط
                const uniqueData = Array.from(new Map(rawData.map(item => [item[0]?.trim(), item[1]?.trim()])).entries())
                                     .map(([name, parent]) => ({ name, parent }));
                renderD3Tree(uniqueData);
            }
        });

        function renderD3Tree(data) {
            const width = window.innerWidth;
            const height = window.innerHeight;

            svg = d3.select("#tree-container").append("svg")
                .attr("width", width).attr("height", height);
            
            g = svg.append("g");

            zoom = d3.zoom().on("zoom", (e) => g.attr("transform", e.transform));
            svg.call(zoom);

            const stratify = d3.stratify().id(d => d.name).parentId(d => d.parent);
            const root = stratify(data);
            const treeLayout = d3.tree().nodeSize([150, 200]);
            treeLayout(root);

            // رسم الخطوط
            g.selectAll(".link").data(root.links()).enter().append("path")
                .attr("class", "link")
                .attr("d", d3.linkVertical().x(d => d.x).y(d => d.y));

            // رسم المربعات والأسماء
            const node = g.selectAll(".node").data(root.descendants()).enter().append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.x},${d.y})`);

            node.append("rect").attr("x", -60).attr("y", -20).attr("width", 120).attr("height", 40);
            node.append("text").attr("dy", 5).text(d => d.data.name);

            resetZoom();
        }

        function resetZoom() {
            svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(window.innerWidth/2, 50).scale(0.8));
        }

        function exportPDF() {
            const element = document.getElementById('tree-container');
            const opt = {
                margin: 0,
                filename: 'Family-Tree.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'in', format: 'a3', orientation: 'landscape' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
