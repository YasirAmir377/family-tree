<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شجرة العائلة التفاعلية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --line-color: #bdc3c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--primary-color); margin-bottom: 10px; }
        .subtitle { color: #7f8c8d; margin-bottom: 30px; }

        /* الشجرة */
        .tree ul {
            padding-top: 20px; 
            position: relative;
            display: flex;
            justify-content: center;
            transition: all 0.5s;
        }

        .tree li {
            text-align: center;
            list-style-type: none;
            position: relative;
            padding: 20px 5px 0 5px;
            transition: all 0.5s;
        }

        .tree li::before, .tree li::after {
            content: '';
            position: absolute; top: 0; right: 50%;
            border-top: 2px solid var(--line-color);
            width: 50%; height: 20px;
        }
        .tree li::after {
            right: auto; left: 50%;
            border-left: 2px solid var(--line-color);
        }

        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::after { border-radius: 5px 0 0 0; }
        .tree li:last-child::before { border-right: 2px solid var(--line-color); border-radius: 0 5px 0 0; }
        
        .tree ul ul::before {
            content: '';
            position: absolute; top: 0; left: 50%;
            border-left: 2px solid var(--line-color);
            width: 0; height: 20px;
        }

        .tree li div {
            border: 1px solid var(--line-color);
            padding: 12px 20px;
            background: #fff;
            color: var(--primary-color);
            font-weight: bold;
            display: inline-block;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            min-width: 120px;
            transition: all 0.3s;
        }

        .tree li div:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        #loading { font-weight: bold; color: var(--accent-color); margin-top: 50px; }
    </style>
</head>
<body>

    <h1>شجرة العائلة</h1>
    <p class="subtitle">يتم التحديث تلقائياً من Google Sheets</p>
    
    <div id="loading">جاري جلب البيانات من الملف...</div>
    <div class="tree" id="familyTree"></div>

    <script>
        // الرابط الخاص بملفك
        const csvURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT_6K2hzmPfC9PGa-p0rbJvVsGxP7B7fb2yqXJC8CS34Q9gYAkN_M2HHvadooj2csNe5gZ5kDFIw2hh/pub?output=csv';

        Papa.parse(csvURL, {
            download: true,
            header: false, // سنعالج البيانات يدوياً لضمان المرونة
            skipEmptyLines: true,
            complete: function(results) {
                const rows = results.data;
                
                // تنظيف البيانات وتحويلها لمصفوفة كائنات
                // إذا كان أول سطر يحتوي على كلمة "الاسم" أو "الأب"، سنتخطاه
                const startIndex = (rows[0][0].includes("الاسم") || rows[0][0].includes("Name")) ? 1 : 0;
                
                const familyData = rows.slice(startIndex).map(row => ({
                    name: row[0]?.trim(),
                    parent: row[1]?.trim()
                })).filter(item => item.name);

                if (familyData.length > 0) {
                    document.getElementById('loading').style.display = 'none';
                    renderTree(familyData);
                } else {
                    document.getElementById('loading').innerText = "تم الاتصال ولكن لم يتم العثور على أسماء.";
                }
            },
            error: function() {
                document.getElementById('loading').innerHTML = "<span style='color:red;'>فشل تحميل البيانات. تأكد من أن الملف 'منشور للويب' بصيغة CSV.</span>";
            }
        });

        function renderTree(data) {
            const map = {};
            data.forEach(item => map[item.name] = { ...item, children: [] });

            let roots = [];
            data.forEach(item => {
                if (item.parent && map[item.parent]) {
                    map[item.parent].children.push(map[item.name]);
                } else {
                    roots.push(map[item.name]);
                }
            });

            const container = document.getElementById('familyTree');
            const html = roots.map(root => "<ul>" + createNodeHTML(root) + "</ul>").join('');
            container.innerHTML = html;
        }

        function createNodeHTML(node) {
            let html = `<li><div>${node.name}</div>`;
            if (node.children.length > 0) {
                html += "<ul>" + node.children.map(child => createNodeHTML(child)).join('') + "</ul>";
            }
            html += "</li>";
            return html;
        }
    </script>
</body>
</html>
