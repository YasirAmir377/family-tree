<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شجرة العائلة الشاملة</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; overflow: hidden; }
        #toolbar { position: fixed; top: 20px; right: 20px; z-index: 1000; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); display: flex; gap: 10px; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 6px; background: #2c3e50; color: white; font-weight: bold; transition: 0.3s; }
        button:hover { background: #34495e; transform: translateY(-2px); }
        .node rect { fill: #fff; stroke: #2c3e50; stroke-width: 2px; rx: 6; ry: 6; }
        .node text { font-size: 13px; font-weight: bold; text-anchor: middle; fill: #2c3e50; }
        .link { fill: none; stroke: #bdc3c7; stroke-width: 2px; }
        #tree-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<div id="toolbar">
    <button onclick="exportPDF()" style="background: #e74c3c;">📥 تحميل PDF</button>
    <button onclick="resetZoom()">🔄 إعادة الضبط</button>
</div>

<div id="tree-container"></div>

<script>
    const csvURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT_6K2hzmPfC9PGa-p0rbJvVsGxP7B7fb2yqXJC8CS34Q9gYAkN_M2HHvadooj2csNe5gZ5kDFIw2hh/pub?output=csv';

    let svg, g, zoom;

    Papa.parse(csvURL, {
        download: true, header: false, skipEmptyLines: true,
        complete: function(results) {
            const allRows = results.data;
            const relations = new Set();
            const namesFound = new Set();

            // مسح كل خلية في الإكسل وربطها بما قبلها (عرضياً)
            allRows.forEach(row => {
                for (let i = 0; i < row.length; i++) {
                    let child = row[i]?.trim();
                    let parent = (i > 0) ? row[i-1]?.trim() : null;

                    if (child && child !== "") {
                        namesFound.add(child);
                        if (parent && parent !== "" && child !== parent) {
                            relations.add(JSON.stringify({ name: child, parent: parent }));
                        }
                    }
                }
            });

            // تحويل العلاقات إلى صيغة تقبلها الشجرة
            const cleanData = Array.from(relations).map(r => JSON.parse(r));
            const childNames = new Set(cleanData.map(d => d.name));
            
            // إضافة "رؤوس الشجرة" (الأسماء التي ليس لها أب في الجدول)
            namesFound.forEach(name => {
                if (!childNames.has(name)) {
                    // التحقق إذا كان الاسم أب لأحد ما
                    const isParent = cleanData.some(d => d.parent === name);
                    if (isParent) cleanData.push({ name: name, parent: "" });
                }
            });

            // إزالة أي تكرار نهائي لضمان عدم تعطل D3
            const finalData = [];
            const finalSeen = new Set();
            cleanData.forEach(d => {
                if (!finalSeen.has(d.name)) {
                    finalData.push(d);
                    finalSeen.add(d.name);
                }
            });

            initD3Tree(finalData);
        }
    });

    function initD3Tree(data) {
        const width = window.innerWidth, height = window.innerHeight;
        svg = d3.select("#tree-container").append("svg").attr("width", width).attr("height", height);
        g = svg.append("g");
        zoom = d3.zoom().scaleExtent([0.1, 3]).on("zoom", (e) => g.attr("transform", e.transform));
        svg.call(zoom);

        try {
            const root = d3.stratify().id(d => d.name).parentId(d => d.parent)(data);
            d3.tree().nodeSize([160, 200])(root);

            g.selectAll(".link").data(root.links()).enter().append("path")
                .attr("class", "link")
                .attr("d", d3.linkVertical().x(d => d.x).y(d => d.y));

            const node = g.selectAll(".node").data(root.descendants()).enter().append("g")
                .attr("class", "node").attr("transform", d => `translate(${d.x},${d.y})`);

            node.append("rect").attr("x", -70).attr("y", -20).attr("width", 140).attr("height", 40);
            node.append("text").attr("dy", 5).text(d => d.data.name);
            resetZoom();
        } catch (e) {
            console.error(e);
            alert("حدث خطأ في ترابط الأسماء. تأكد من عدم وجود اسم 'ابن' لنفسه.");
        }
    }

    function resetZoom() {
        svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(window.innerWidth/2, 100).scale(0.6));
    }

    function exportPDF() {
        const element = document.getElementById('tree-container');
        html2pdf().from(element).set({
            margin: 10, filename: 'Family-Tree-Large.pdf',
            jsPDF: { unit: 'mm', format: 'a2', orientation: 'landscape' }
        }).save();
    }
</script>
</body>
</html>
